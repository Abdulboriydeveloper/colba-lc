<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Colba kimyo va biologiya sinov darsiga yozilish formasi" />
  <title>Colba</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue: #1e90ff; --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { height: 100%; font-family: var(--font); }
    button, input { font: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .page {
      max-height: 100vh;
      display: flex; flex-direction: column;
      background: linear-gradient(135deg, #0d3b51 0%, #1689bf 50%, #1299d5 100%);
      color: #fff; overflow: hidden;
    }

    /* NAVBAR */
    .navbar {
      position: relative; z-index: 10;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; padding: 20px 40px 40px;
      max-width: 1280px; width: 100%; margin: 0 auto;
    }
    .nav-logo { width: 176px; display: flex; align-items: center; gap: 13px; text-decoration: none; flex-shrink: 0; }
    .logo-img { width: 100%; height: auto; display: block; }
    .lang-wrap { position: relative; z-index: 200; }
    .nav-lang {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px; padding: 9px 16px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: background .2s;
      position: relative; user-select: none; z-index: 200; color: #fff;
    }
    .nav-lang:hover { background: rgba(255,255,255,0.12); }
    .nav-lang:focus-visible, .fc-btn:focus-visible, .fc-reset:focus-visible, .fs-trigger:focus-visible, .sdot:focus-visible, .dd-item:focus-visible {
      outline: 3px solid rgba(255,255,255,0.95);
      outline-offset: 3px;
    }
    .fs-trigger:focus-visible, .fc-reset:focus-visible { outline-color: #0d3b51; }
    .nav-lang .flag { font-size: 18px; }
    .nav-lang .chevron { font-size: 10px; color: rgba(255,255,255,0.55); margin-left: 2px; }
    .lang-dd {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: #131f3a; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      z-index: 300; min-width: 145px; display: none;
    }
    .lang-dd.open { display: block; }
    .dd-item { width: 100%; padding: 11px 18px; font-size: 13px; font-weight: 500; transition: background .15s; white-space: nowrap; cursor: pointer; color: #fff; background: transparent; border: 0; text-align: left; }
    .dd-item:hover { background: rgba(255,255,255,0.08); }

    /* MAIN */
    .main {
      flex: 1; position: relative; z-index: 10;
      display: flex; align-items: flex-start; gap: 20px;
      padding: 0 40px 40px; max-width: 1280px; width: 100%; margin: 40px auto;
    }

    /* LEFT */
    .left { flex: 1; display: flex; flex-direction: column; gap: 80px; }
    .hero-title { font-family: var(--font); font-weight: 800; font-size: clamp(34px, 4.2vw, 50px); line-height: 1.1; color: #fff; }

    /* SLIDER */
    .slider-outer { display: flex; flex-direction: column; gap: 14px; }
    .slide-card {
      width: 620px; height: 350px; border-radius: 22px; overflow: hidden;
      position: relative; box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr;
    }
    .slide-card.slide-enter     { animation: sEnter .38s cubic-bezier(.22,1,.36,1) both; }
    .slide-card.slide-exit-next { animation: sExitL .38s cubic-bezier(.22,1,.36,1) both; }
    .slide-card.slide-exit-prev { animation: sExitR .38s cubic-bezier(.22,1,.36,1) both; }
    @keyframes sEnter { from{opacity:0;transform:scale(.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
    @keyframes sExitL { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-20px) scale(.96)} }
    @keyframes sExitR { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(20px) scale(.96)} }

    .sc-photo { position: relative; overflow: hidden; min-height: 280px; }
    .sc-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .sc-photo-placeholder { width: 100%; height: 100%; min-height: 280px; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.1); }
    .sc-body { display: flex; flex-direction: column; justify-content: center; padding: 28px 24px 36px 20px; gap: 14px; position: relative; }
    .sc-body::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; border:3px solid rgba(255,255,255,0.15); border-radius:50%; pointer-events:none; }
    .sc-body::after  { content:''; position:absolute; bottom:10px; right:10px; width:60px; height:60px; border:2px solid rgba(255,255,255,0.12); border-radius:50%; pointer-events:none; }
    .sc-tag { display:none; }
    .sc-title { font-family:var(--font); font-weight:900; font-size:clamp(18px,2.2vw,26px); line-height:1.15; color:#fff; text-transform:uppercase; }
    .sc-desc { font-size:12px; color:rgba(255,255,255,0.85); line-height:1.65; }
    .sc-deco { position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden; border-radius:22px; }
    .sc-deco span { position:absolute; display:block; background:rgba(255,255,255,0.06); transform-origin:center; }
    .sc-deco span:nth-child(1) { width:3px; height:200%; top:-50%; right:42%; transform:rotate(20deg); }
    .sc-deco span:nth-child(2) { width:2px; height:200%; top:-50%; right:38%; transform:rotate(20deg); }

    .sdots { display:flex; gap:7px; }
    .sdot { width:8px; height:8px; padding:0; border:0; border-radius:50%; background:rgba(255,255,255,0.36); cursor:pointer; transition:width .3s cubic-bezier(.34,1.56,.64,1), background .3s, border-radius .3s; }
    .sdot.active { width:26px; border-radius:4px; background:var(--c,#fff); }

    /* ARROW */
    .arrow-wrap { flex-shrink:0; opacity:0.85; }

    /* FORM CARD */
    .right { flex-shrink:0; width:476px; }
    .form-card {
      width:476px; height: 600px; background:#fff; border-radius:24px;
      border:2px solid #5aabff;
      box-shadow:0 0 0 1px rgba(30,144,255,0.07), 0 24px 60px rgba(0,0,0,0.45);
      padding:36px 36px 32px;
      display:flex; flex-direction:column;
    }
    .fc-header { text-align:center; margin-bottom:8px; width: auto; height: 115px; }
    .fc-title {
      font-family:var(--font); font-weight:800; font-size:38px;
      background:linear-gradient(135deg,#0d3b51 0%,#1689bf 50%,#1299d5 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      line-height:1.2; margin-bottom:10px;
    }
    .fc-sub { font-size:13px; color:#475569; font-style:italic; }

    /* FIELDS */
    .fc-fields { display:flex; flex-direction:column; margin:16px 0 18px; gap: 5px; }

    .fi { border-bottom:1.5px solid #e2e8f0; padding:16px 4px; position:relative; transition:border-color .2s; }
    .fi:focus-within { border-color:var(--blue); }
    .fi.fi-err { border-color:#f87171 !important; }
    .fi input { width:100%; border:none; outline:none; font-family:var(--font); font-size:16px; color:#1a1a2e; background:transparent; }
    .fi input::placeholder { color:#64748b; }
    .fi input:disabled { opacity:0.6; cursor:not-allowed; }

    .fs-wrap {
      position: relative;
      border-bottom: 1.5px solid #e2e8f0;
      transition: border-color .2s;
    }
    .fs-wrap.open   { border-color: var(--blue); }
    .fs-wrap.fs-err { border-color: #f87171 !important; }

    .fs-trigger {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 4px;
      cursor: pointer; user-select: none;
      width: 100%; border: 0; background: transparent;
      font-family: var(--font); font-size: 16px; color: #64748b;
    }
    .fs-trigger.has-value { color: #1a1a2e; }

    .fs-arrow {
      font-size: 11px; color: #94a3b8; flex-shrink: 0;
      transition: transform .22s cubic-bezier(.22,1,.36,1);
    }
    .fs-wrap.open .fs-arrow { transform: rotate(180deg); }

    .fs-dropdown {
      position: absolute; left: -4px; right: -4px;
      top: calc(100% + 2px);
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.13);
      z-index: 500;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .2s, transform .22s cubic-bezier(.22,1,.36,1);
    }
    .fs-wrap.open .fs-dropdown {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .fs-option {
      width: 100%; border: 0; background: #fff; text-align: left;
      padding: 13px 16px;
      font-size: 15px; color: #1a1a2e;
      cursor: pointer; transition: background .15s;
    }
    .fs-option:hover  { background: #f0f7ff; }
    .fs-option.active { background: #e8f4ff; color: #1689bf; font-weight: 600; }

    .filial-row { display: none; }
    .filial-row.visible {
      display: block;
      animation: fadeDown .28s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* SUBMIT */
    .fc-btn {
      width:100%; height:58px;
      background:linear-gradient(135deg,#0d3b51 0%,#1689bf 50%,#1299d5 100%);
      color:#fff; border:none; cursor:pointer; border-radius:16px;
      font-family:var(--font); font-weight:800; font-size:17px;
      transition:filter .15s, transform .15s, box-shadow .15s;
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-top:auto; flex-shrink:0;
    }
    .fc-btn:hover { filter:brightness(1.1); transform:translateY(-2px); box-shadow:0 12px 32px rgba(30,144,255,0.45); }
    .fc-btn:active { transform:translateY(0); }
    .fc-btn:disabled { opacity:0.75; cursor:not-allowed; transform:none; box-shadow:none; filter:none; }

    .fc-error { font-size:13px; color:#b91c1c; text-align:center; padding:6px 4px 0; line-height:1.5; display:none; }

    .fc-spinner { display:inline-block; width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* SUCCESS */
    .fc-success { display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; animation:popIn .35s cubic-bezier(.34,1.56,.64,1); padding:40px 0; }
    @keyframes popIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    .fc-check { width:68px; height:68px; border-radius:50%; background:#22c55e; display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; }
    .fc-success h3 { font-family:var(--font); font-weight:800; font-size:22px; color:#0b1a3e; }
    .fc-success p  { font-size:14px; color:#64748b; }
    .fc-reset { background:transparent; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 24px; font-size:13px; cursor:pointer; color:#64748b; transition:border-color .2s; }
    .fc-reset:hover { border-color:#0b1a3e; color:#0b1a3e; }

    /* RESPONSIVE */
    @media (max-width:1200px) { .arrow-wrap{display:none;} .main{gap:28px;} }
    @media (max-width:1024px) {
      .navbar{padding:20px 24px;}
      .main{padding:0 24px 32px; gap:24px;}
      .right{width:400px;} .form-card{width:100%;} .fc-title{font-size:28px;}
    }
    @media (max-width:860px) {
      html,body{height:auto;} .page{min-height:100svh; overflow:auto; max-height:none;}
      .navbar{padding:16px 20px;} .nav-logo{width:140px;}
      .main{flex-direction:column; align-items:stretch; padding:0 20px 40px; margin-top:12px; gap:28px;}
      .left{gap:22px;} .hero-title{font-size:clamp(26px,7vw,40px);}
      .slide-card{width:100%; height: 300px;}
      .right{width:100%;} .form-card{width:100%; height:auto;} .fc-title{font-size:26px;} .fc-btn{height:54px; font-size:15px;}
    }
    @media (max-width:480px) {
      .navbar{padding:14px 16px;} .nav-logo{width:120px;}
      .main{padding:0 16px; gap:22px; z-index:9; margin:50px auto;}
      .hero-title{font-size:clamp(22px,8vw,34px);}
      .slide-card{height: 300px !important;}
      .form-card{padding:24px 18px 22px; border-radius:20px; height:auto;} .fc-title{font-size:22px;}
      .fi input,.fs-trigger{font-size:15px;} .fc-btn{height:52px; font-size:14px; border-radius:14px;}
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div class="page">

          <p class="fc-error" id="netError" role="alert"></p>

<script>
/* ══════════════════════════════════════════════════
   CONFIG
   Bitrix webhook — faqat Toshkent lidlari tushadi
══════════════════════════════════════════════════ */
const BITRIX_WEBHOOK = 'https://colba.bitrix24.kz/rest/17/26223axyuok2wj2u'
const LEAD_SOURCE    = 'REPEAT_SALE' // Bitrix Source: Website
const BITRIX_FIELDS = {
  fullName: 'UF_CRM_LEAD_1753906771051',
  filial:   'UF_CRM_1729075562007',
  filialText: 'UF_CRM_QASIFILIALDAO',
  branchText: 'UF_CRM_BRANCH',
}

const BITRIX_FILIAL_IDS = {
  chilonzor: '637',
  yunusobod: '921',
  sergeli:   '493',
  // Bitrixdagi "Filial?" ro'yxatida Mirobod yo'q. Matn alohida fieldlarga yoziladi.
}

/**
 * Faqat Toshkent tanlanganda chaqiriladi.
 * filial har doim mavjud bo'ladi (toshkent uchun filial majburiy).
 */
async function sendToBitrix({ name, phone, filial, lang }) {
  const url  = `${BITRIX_WEBHOOK}/crm.lead.add.json`
  const body = new FormData()
  body.append('fields[TITLE]',                `Colba — ${name} - WEB`)
  body.append('fields[NAME]',                 name)
  body.append(`fields[${BITRIX_FIELDS.fullName}]`, name)
  body.append('fields[PHONE][0][VALUE]',      phone)
  body.append('fields[PHONE][0][VALUE_TYPE]', 'WORK')
  body.append('fields[SOURCE_ID]',            LEAD_SOURCE)
  body.append(`fields[${BITRIX_FIELDS.filialText}]`, filial.label)
  body.append(`fields[${BITRIX_FIELDS.branchText}]`, filial.label)
  if (filial.bitrixId) {
    body.append(`fields[${BITRIX_FIELDS.filial}]`, filial.bitrixId)
  }
  body.append('fields[COMMENTS]',
    `Til: ${lang === 'uz' ? "O'zbek" : 'Rus'} | Shahar: Toshkent | Filial: ${filial.label} | Sayt: Colba lid forma`)
  body.append('fields[STATUS_ID]', 'NEW')

  const res = await fetch(url, { method: 'POST', body })
  if (!res.ok) throw new Error(`Bitrix error: ${res.status}`)
  return res.json()
}

const FLAGS = { uz: '🇺🇿', ru: '🇷🇺' }

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let lang = 'uz', current = 0, animating = false, timer = null, sending = false
let selCity = '', selFilial = ''

/* ══════════════════════════════════════════════════
   DOM REFS
══════════════════════════════════════════════════ */
const g = id => document.getElementById(id)
const heroTitle     = g('heroTitle'),    slideCard     = g('slideCard'),    scPhoto        = g('scPhoto')
const scTag         = g('scTag'),        scTitle       = g('scTitle'),      scDesc         = g('scDesc'),      sdots = g('sdots')
const fcTitle       = g('fcTitle'),      fcSub         = g('fcSub')
const nameInput     = g('nameInput'),    phoneInput    = g('phoneInput')
const fiName        = g('fiName'),       fiPhone       = g('fiPhone')
const cityWrap      = g('cityWrap'),     cityTrigger   = g('cityTrigger'),  cityLabelEl    = g('cityLabel'),    cityDropdown  = g('cityDropdown')
const filialRow     = g('filialRow'),    filialWrap    = g('filialWrap'),   filialTrigger  = g('filialTrigger'), filialLabelEl = g('filialLabel'),  filialDropdown = g('filialDropdown')
const submitBtn     = g('submitBtn'),    netError      = g('netError'),     formView       = g('formView'),     successView   = g('successView')
const successTitle  = g('successTitle'), successMsg    = g('successMsg'),   resetBtn       = g('resetBtn')
const langBtn       = g('langBtn'),      langDd        = g('langDd'),       flagIcon       = g('flagIcon'),     langLabel     = g('langLabel')

/* ══════════════════════════════════════════════════
   DROPDOWN HELPERS
══════════════════════════════════════════════════ */
function buildDropdown(el, options, activeVal, onPick) {
  el.innerHTML = ''
  options.forEach(opt => {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'fs-option' + (opt.v === activeVal ? ' active' : '')
    btn.textContent = opt.l
    btn.setAttribute('role', 'option')
    btn.setAttribute('aria-selected', String(opt.v === activeVal))
    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); onPick(opt) })
    el.appendChild(btn)
  })
}

function closeAllSelects() {
  cityWrap.classList.remove('open')
  filialWrap.classList.remove('open')
  langDd.classList.remove('open')
  cityTrigger.setAttribute('aria-expanded', 'false')
  filialTrigger.setAttribute('aria-expanded', 'false')
  langBtn.setAttribute('aria-expanded', 'false')
}

function getPhoneDigits(value) {
  return value.replace(/\D/g, '')
}

function getLocalPhoneDigits(value) {
  const digits = getPhoneDigits(value)
  if (digits.startsWith('998')) return digits.slice(3, 12)
  if (digits.startsWith('0')) return digits.slice(1, 10)
  return digits.slice(0, 9)
}

function formatPhone(value) {
  const local = getLocalPhoneDigits(value)
  if (!local) return ''

  const parts = ['+998']
  if (local.length > 0) parts.push(local.slice(0, 2))
  if (local.length > 2) parts.push(local.slice(2, 5))
  if (local.length > 5) parts.push(local.slice(5, 7))
  if (local.length > 7) parts.push(local.slice(7, 9))

  return parts.join(' ')
}

function isValidPhone(value) {
  return getPhoneDigits(value).length === 12 && getPhoneDigits(value).startsWith('998')
}

/* ── City select ── */
cityTrigger.addEventListener('click', e => {
  e.stopPropagation()
  if (cityWrap.classList.contains('open')) {
    closeAllSelects()
  } else {
    closeAllSelects()
    cityWrap.classList.add('open')
    cityTrigger.setAttribute('aria-expanded', 'true')
  }
})

function onCityPick(opt) {
  selCity   = opt.v
  selFilial = ''
  cityLabelEl.textContent = opt.l
  cityTrigger.classList.add('has-value')
  cityWrap.classList.remove('open', 'fs-err')
  cityTrigger.setAttribute('aria-expanded', 'false')
  cityTrigger.setAttribute('aria-invalid', 'false')
  buildDropdown(cityDropdown, T[lang].cities, selCity, onCityPick)

  if (selCity === 'toshkent') {
    filialLabelEl.textContent = T[lang].filialPh
    filialTrigger.classList.remove('has-value')
    filialWrap.classList.remove('fs-err')
    buildDropdown(filialDropdown, T[lang].filials, '', onFilialPick)
    filialRow.classList.remove('visible')
    filialRow.setAttribute('aria-hidden', 'false')
    void filialRow.offsetWidth          // reflow — animation qayta ishlashi uchun
    filialRow.classList.add('visible')
  } else {
    filialRow.classList.remove('visible')
    filialRow.setAttribute('aria-hidden', 'true')
    filialWrap.classList.remove('fs-err')
    selFilial = ''
  }
}

/* ── Filial select ── */
filialTrigger.addEventListener('click', e => {
  e.stopPropagation()
  if (filialWrap.classList.contains('open')) {
    closeAllSelects()
  } else {
    closeAllSelects()
    filialWrap.classList.add('open')
    filialTrigger.setAttribute('aria-expanded', 'true')
  }
})

function onFilialPick(opt) {
  selFilial = opt.v
  filialLabelEl.textContent = opt.l
  filialTrigger.classList.add('has-value')
  filialWrap.classList.remove('open', 'fs-err')
  filialTrigger.setAttribute('aria-expanded', 'false')
  filialTrigger.setAttribute('aria-invalid', 'false')
  buildDropdown(filialDropdown, T[lang].filials, selFilial, onFilialPick)
}

/* ══════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════ */
function renderSlider() {
  const slides = SLIDES[lang], slide = slides[current], t = T[lang]
  heroTitle.innerHTML = t.heroTitle.map(l => `<span>${l}<br/></span>`).join('')
  slideCard.style.background = slide.bg
  scPhoto.innerHTML = ''
  const ph = document.createElement('div')
  ph.className = 'sc-photo-placeholder'
  ph.style.cssText = 'font-size:88px; align-items:flex-end'
  ph.setAttribute('aria-hidden', 'true')
  ph.textContent = slide.e
  scPhoto.appendChild(ph)
  scTitle.innerHTML  = slide.title.replace(/\n/g, '<br/>')
  scDesc.textContent = slide.desc
  sdots.innerHTML = ''
  slides.forEach((s, i) => {
    const d = document.createElement('button')
    d.type = 'button'
    d.className = 'sdot' + (i === current ? ' active' : '')
    d.setAttribute('aria-label', `${i + 1}-slayd`)
    d.setAttribute('aria-current', i === current ? 'true' : 'false')
    d.style.setProperty('--c', s.color)
    d.addEventListener('click', e => { e.stopPropagation(); goTo(i, i > current ? 'next' : 'prev'); resetTimer() })
    sdots.appendChild(d)
  })
}

function renderForm() {
  const t = T[lang]
  document.documentElement.lang = lang
  fcTitle.textContent    = t.formTitle
  fcSub.textContent      = t.formSub
  submitBtn.textContent  = t.btnText
  resetBtn.textContent   = t.back
  flagIcon.textContent   = FLAGS[lang]
  langLabel.textContent  = t.langLbl
  nameInput.placeholder  = t.namePh
  phoneInput.placeholder = t.phonePh
  nameInput.setAttribute('aria-label', t.namePh)
  phoneInput.setAttribute('aria-label', t.phonePh)
  cityTrigger.setAttribute('aria-label', t.cityPh)
  filialTrigger.setAttribute('aria-label', t.filialPh)
  if (!selCity)   { cityLabelEl.textContent   = t.cityPh;   cityTrigger.classList.remove('has-value') }
  if (!selFilial) { filialLabelEl.textContent = t.filialPh; filialTrigger.classList.remove('has-value') }
  buildDropdown(cityDropdown,   t.cities,  selCity,   onCityPick)
  buildDropdown(filialDropdown, t.filials, selFilial, onFilialPick)
}

function resetFormState() {
  selCity = ''; selFilial = ''
  nameInput.value  = ''
  phoneInput.value = ''
  netError.style.display = 'none'
  fiName.classList.remove('fi-err');    fiPhone.classList.remove('fi-err')
  cityWrap.classList.remove('fs-err'); filialWrap.classList.remove('fs-err')
  filialRow.classList.remove('visible')
  filialRow.setAttribute('aria-hidden', 'true')
  nameInput.setAttribute('aria-invalid', 'false')
  phoneInput.setAttribute('aria-invalid', 'false')
  cityTrigger.setAttribute('aria-invalid', 'false')
  filialTrigger.setAttribute('aria-invalid', 'false')
  cityTrigger.classList.remove('has-value'); filialTrigger.classList.remove('has-value')
}

function renderAll() { renderSlider(); renderForm() }

/* ══════════════════════════════════════════════════
   SLIDER
══════════════════════════════════════════════════ */
function goTo(idx, dir) {
  if (animating) return
  animating = true
  slideCard.className = 'slide-card ' + (dir === 'next' ? 'slide-exit-next' : 'slide-exit-prev')
  setTimeout(() => {
    current = idx
    renderSlider()
    slideCard.className = 'slide-card slide-enter'
    animating = false
  }, 380)
}
function next()       { goTo((current + 1) % SLIDES[lang].length, 'next') }
function resetTimer() { clearInterval(timer); timer = setInterval(next, 4800) }

/* ══════════════════════════════════════════════════
   GLOBAL CLICK
══════════════════════════════════════════════════ */
document.addEventListener('click', closeAllSelects)

/* ══════════════════════════════════════════════════
   LANG SWITCHER
══════════════════════════════════════════════════ */
langBtn.addEventListener('click', e => {
  e.stopPropagation()
  const willOpen = !langDd.classList.contains('open')
  closeAllSelects()
  langDd.classList.toggle('open', willOpen)
  langBtn.setAttribute('aria-expanded', String(willOpen))
})
document.querySelectorAll('.dd-item').forEach(item => {
  item.addEventListener('click', e => {
    e.stopPropagation()
    lang = item.dataset.lang; current = 0
    formView.style.display    = ''
    successView.style.display = 'none'
    resetFormState()
    renderAll()
    langDd.classList.remove('open')
  })
})

/* ══════════════════════════════════════════════════
   INPUT VALIDATION CLEAR
══════════════════════════════════════════════════ */
nameInput.addEventListener('input',  () => {
  fiName.classList.remove('fi-err')
  nameInput.setAttribute('aria-invalid', 'false')
})
phoneInput.addEventListener('focus', () => {
  if (!phoneInput.value) phoneInput.value = '+998 '
})
phoneInput.addEventListener('input', () => {
  phoneInput.value = formatPhone(phoneInput.value)
  fiPhone.classList.remove('fi-err')
  phoneInput.setAttribute('aria-invalid', 'false')
})
phoneInput.addEventListener('blur', () => {
  if (getLocalPhoneDigits(phoneInput.value).length === 0) phoneInput.value = ''
})

/* ══════════════════════════════════════════════════
   SUBMIT
   ┌─────────────────────────────────────────────┐
   │  selCity === 'toshkent'                     │
   │    → filial majburiy                        │
   │    → Bitrix ga lid yuboriladi               │
   │                                             │
   │  selCity === 'boshqa'                       │
   │    → filial ko'rinmaydi, kerak emas         │
   │    → Bitrix ga HECH NARSA yuborilmaydi      │
   │    → faqat success ekran ko'rsatiladi       │
   └─────────────────────────────────────────────┘
══════════════════════════════════════════════════ */
submitBtn.addEventListener('click', async () => {
  if (sending) return

  const t     = T[lang]
  const name  = nameInput.value.trim()
  const phone = formatPhone(phoneInput.value).trim()
  phoneInput.value = phone
  let hasErr  = false

  /* ── Validatsiya ── */
  if (!name)  { fiName.classList.add('fi-err'); nameInput.setAttribute('aria-invalid', 'true'); hasErr = true }
  else          { fiName.classList.remove('fi-err'); nameInput.setAttribute('aria-invalid', 'false') }

  if (!isValidPhone(phone)) {
    fiPhone.classList.add('fi-err'); phoneInput.setAttribute('aria-invalid', 'true'); hasErr = true
  } else { fiPhone.classList.remove('fi-err'); phoneInput.setAttribute('aria-invalid', 'false') }

  if (!selCity) {
    cityWrap.classList.add('fs-err'); cityTrigger.setAttribute('aria-invalid', 'true'); hasErr = true
  } else { cityWrap.classList.remove('fs-err'); cityTrigger.setAttribute('aria-invalid', 'false') }

  // Filial faqat Toshkent uchun majburiy
  if (selCity === 'toshkent' && !selFilial) {
    filialWrap.classList.add('fs-err'); filialTrigger.setAttribute('aria-invalid', 'true'); hasErr = true
  } else { filialWrap.classList.remove('fs-err'); filialTrigger.setAttribute('aria-invalid', 'false') }

  if (hasErr) return

  /* ── Yuborish ── */
  sending = true
  netError.style.display = 'none'
  submitBtn.disabled = true
  submitBtn.innerHTML = `<span class="fc-spinner"></span> ${t.btnWait}`

  try {
    if (selCity === 'toshkent') {
      // ✅ Toshkent → filial bilan Bitrix ga yuboriladi
      const filialLabel = t.filials.find(f => f.v === selFilial)?.l || selFilial
      await sendToBitrix({
        name,
        phone,
        filial: {
          label: filialLabel,
          bitrixId: BITRIX_FILIAL_IDS[selFilial],
        },
        lang,
      })

    } else {
      // ⛔ Boshqa shahar → Bitrix ga YUBORILMAYDI
      // (faqat success ko'rsatiladi)
      console.info('[Colba] Boshqa shahar tanlandi — lid Bitrix ga yuborilmadi.')
    }

    // Ikki holda ham success ko'rsatiladi
    formView.style.display    = 'none'
    successView.style.display = ''
    successTitle.textContent  = `${t.okTitle}, ${name}!`
    successMsg.textContent    = t.okMsg

  } catch (err) {
    console.error('[Colba] Bitrix xatosi:', err)
    netError.textContent   = t.errNet
    netError.style.display = ''
  } finally {
    sending = false
    submitBtn.disabled    = false
    submitBtn.textContent = T[lang].btnText
  }
})

/* ══════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════ */
resetBtn.addEventListener('click', () => {
  formView.style.display    = ''
  successView.style.display = 'none'
  resetFormState()
  renderAll()
})

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
renderAll()
timer = setInterval(next, 4800)
</script>
